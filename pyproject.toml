[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-intelligence"
version = "0.1.0"
description = "A private, offline-first AI meeting protocol assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
  "pyannote.audio>=4,<5",
  "huggingface-hub>=0.28,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008", "BLE001"]
